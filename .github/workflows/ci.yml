name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: System libs for WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - name: Install (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          pip install -e '.[kronos,pdf,dev]'
      - name: License gate
        run: python scripts/check_licenses.py
      - name: Tests (incl. Kronos-mini CPU tests; downloads pinned HF weights)
        run: pytest -q
