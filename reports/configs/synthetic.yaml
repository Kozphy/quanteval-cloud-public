title: "Benchmark report: synthetic GARCH daily series (SYNTH-GARCH)"
data_provenance: "Fully synthetic; generated by examples/synthetic_ohlcv.py (rows=800, seed=7). No real market data."
synthetic_data: true
horizon: 5
lookback: 256
min_history: 128
max_origins: 150
seed: 42
models: [naive, drift, arima, kronos_mini]
arima_order: [1, 1, 1]
kronos: {sample_count: 5, temperature: 1.0, top_p: 0.9, threads: 4}
backtest: {mode: long_short, cost_bps_per_side: 5.0, cost_sensitivity_bps: [0, 5, 10, 25], delay_bars: 1, min_trades: 30}
